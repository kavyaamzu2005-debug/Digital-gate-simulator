<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Digital Logic Simulator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f1422;
      color: white;
      min-height: 100vh;
    }

    .wrap {
      width: 92%;
      max-width: 1000px;
      margin: auto;
      padding: 30px 0;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .sub {
      color: #9fb4df;
      margin-bottom: 24px;
    }

    .card {
      background: #171e30;
      border: 1px solid #2c3854;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }

    label {
      display: block;
      color: #a9bee8;
      margin-bottom: 8px;
    }

    select {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #34415f;
      background: #0f1422;
      color: white;
      font-size: 17px;
    }

    /* Badge */
    .badge {
      display: inline-block;
      margin: 16px 0 6px;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
    }

    .gate {
      background: #164c48;
      color: #20d4ad;
    }

    .comb {
      background: #1d3a66;
      color: #7fb2ff;
    }

    .seq {
      background: #4a2a5e;
      color: #e0a3ff;
    }

    .desc {
      color: #a9bee8;
      margin: 8px 0 16px;
    }

    /* Input boxes */
    .inputs {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .ib {
      flex: 1 1 130px;
      min-width: 0;
      background: #0f1422;
      border: 1px solid #34415f;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .ib h3 {
      color: #a9bee8;
      font-size: 15px;
      margin-bottom: 6px;
    }

    .val {
      font-size: 34px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    button {
      max-width: 100%;
      padding: 9px 12px;
      border: 0;
      border-radius: 8px;
      background: #304a7a;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #42649e;
    }

    button.clk {
      background: #7a3fa0;
      font-size: 17px;
      padding: 12px 20px;
    }

    /* Output */
    .out {
      margin-top: 18px;
      background: #0f1422;
      border: 1px solid #34415f;
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    .pill {
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 30px;
      background: #164c48;
      color: #20d4ad;
    }

    .pill.zero {
      background: #2a3350;
      color: #8ea0c8;
    }

    .pill.state {
      background: #4a2a5e;
      color: #e0a3ff;
    }

    /* Expression / warning / history */
    .info {
      margin-top: 18px;
      padding: 16px;
      background: #101827;
      border-radius: 12px;
    }

    .formula {
      color: #20d4ad;
      font-size: 18px;
      font-weight: bold;
      margin-top: 6px;
      overflow-wrap: anywhere;
    }

    .warn {
      color: #ff9d9d;
      margin-top: 10px;
    }

    .hist {
      margin-top: 12px;
      color: #a9bee8;
      font-family: monospace;
      overflow-wrap: anywhere;
    }

    .warn:empty,
    .hist:empty {
      display: none;
    }

    /* Table */
    .scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 14px;
    }

    th,
    td {
      padding: 10px 8px;
      text-align: center;
      border-bottom: 1px solid #303b55;
      white-space: nowrap;
    }

    th {
      color: #a9bee8;
    }

    tr.active {
      background: #26385d;
    }

    tr:hover {
      background: #202d49;
    }

    /* Circuit diagram */
    svg {
      width: 100%;
      min-width: 600px;
      height: auto;
    }
  </style>
</head>

<body>
  <div class="wrap">

    <h1>⚡ Digital Logic Simulator</h1>
    <p class="sub">
      Logic gates, combinational circuits and sequential circuits with live
      inputs, outputs, circuit view and truth / characteristic tables.
    </p>

    <div class="card">
      <label for="sel">Select Gate / Circuit</label>
      <select id="sel"></select>

      <div><span class="badge" id="badge"></span></div>
      <div class="desc" id="desc"></div>

      <div class="inputs" id="inputs"></div>
      <div class="out" id="out"></div>

      <div class="info">
        <b>Logic Expression</b>
        <div class="formula" id="formula"></div>
        <div class="warn" id="warn"></div>
        <div class="hist" id="hist"></div>
      </div>
    </div>

    <div class="card">
      <h2>Circuit View (live)</h2>
      <p class="desc">Green wires carry 1, grey wires carry 0.</p>
      <div id="svgbox"></div>
    </div>

    <div class="card">
      <h2 id="ttl">Truth Table</h2>
      <p class="desc">Current input combination is highlighted.</p>
      <div class="scroll">
        <table>
          <thead id="th"></thead>
          <tbody id="tb"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // ---------- Variables ----------
    var current = "AND";      // selected circuit
    var x = [];               // input values, e.g. [0, 1]
    var Q = 0;                // stored bit (sequential circuits)
    var clockHistory = [];    // Q after each clock (NOT named "history")

    var groups = [
      ["Logic Gates", ["AND", "OR", "NOT", "NAND", "NOR", "XOR", "XNOR"]],
      ["Combinational Circuits", ["Half Adder", "Full Adder", "Half Subtractor", "Full Subtractor",
                                  "2:1 MUX", "4:1 MUX", "1:2 DEMUX", "1:4 DEMUX", "2:4 Decoder", "4:2 Encoder"]],
      ["Sequential Circuits", ["SR Latch", "D Flip-Flop", "JK Flip-Flop", "T Flip-Flop"]]
    ];

    // ---------- Circuit type ----------
    function isGate(name) {
      // groups[0][1] = Logic Gates list
      return groups[0][1].indexOf(name) != -1;
    }

    function isSequential(name) {
      return name == "SR Latch" || name == "D Flip-Flop" || name == "JK Flip-Flop" || name == "T Flip-Flop";
    }

    function hasClock(name) {
      return isSequential(name) && name != "SR Latch";
    }

    // ---------- Input names ----------
    function getInputNames(name) {
      switch (name) {
        case "NOT":             return ["A"];
        case "Full Adder":      return ["A", "B", "Cin"];
        case "Full Subtractor": return ["A", "B", "Bin"];
        case "2:1 MUX":         return ["D0", "D1", "S"];
        case "4:1 MUX":         return ["D0", "D1", "D2", "D3", "S1", "S0"];
        case "1:2 DEMUX":       return ["D", "S"];
        case "1:4 DEMUX":       return ["D", "S1", "S0"];
        case "2:4 Decoder":     return ["A1", "A0"];
        case "4:2 Encoder":     return ["D3", "D2", "D1", "D0"];
        case "SR Latch":        return ["S", "R"];
        case "D Flip-Flop":     return ["D"];
        case "JK Flip-Flop":    return ["J", "K"];
        case "T Flip-Flop":     return ["T"];
        default:                return ["A", "B"];
      }
    }

    // ---------- Output names (combinational) ----------
    function getOutputNames(name) {
      switch (name) {
        case "Half Adder":
        case "Full Adder":       return ["SUM", "CARRY"];
        case "Half Subtractor":
        case "Full Subtractor":  return ["DIFF", "BORROW"];
        case "2:1 MUX":
        case "4:1 MUX":          return ["Y"];
        case "1:2 DEMUX":        return ["Y0", "Y1"];
        case "1:4 DEMUX":
        case "2:4 Decoder":      return ["Y0", "Y1", "Y2", "Y3"];
        case "4:2 Encoder":      return ["A1", "A0", "V"];
        default:                 return ["OUT"];
      }
    }

    // ---------- Logic (combinational) ----------
    function calculate(name, x) {
      var r;
      switch (name) {
        case "AND":  return [x[0] & x[1]];
        case "OR":   return [x[0] | x[1]];
        case "NOT":  return [1 - x[0]];
        case "NAND": return [1 - (x[0] & x[1])];
        case "NOR":  return [1 - (x[0] | x[1])];
        case "XOR":  return [x[0] ^ x[1]];
        case "XNOR": return [1 - (x[0] ^ x[1])];

        case "Half Adder":
          return [x[0] ^ x[1], x[0] & x[1]];

        case "Full Adder":
          return [x[0] ^ x[1] ^ x[2], (x[0] & x[1]) | (x[2] & (x[0] ^ x[1]))];

        case "Half Subtractor":
          return [x[0] ^ x[1], (1 - x[0]) & x[1]];

        case "Full Subtractor":
          return [x[0] ^ x[1] ^ x[2], ((1 - x[0]) & x[1]) | ((1 - (x[0] ^ x[1])) & x[2])];

        case "2:1 MUX":
          if (x[2] == 1) return [x[1]];
          return [x[0]];

        case "4:1 MUX":
          return [x[x[4] * 2 + x[5]]];   // x[0..3] = D0..D3, x[4] = S1, x[5] = S0

        case "1:2 DEMUX":
          if (x[1] == 1) return [0, x[0]];
          return [x[0], 0];

        case "1:4 DEMUX":
          r = [0, 0, 0, 0];
          r[x[1] * 2 + x[2]] = x[0];
          return r;

        case "2:4 Decoder":
          r = [0, 0, 0, 0];
          r[x[0] * 2 + x[1]] = 1;
          return r;

        case "4:2 Encoder":              // x = [D3, D2, D1, D0]
          if (x[0] == 1) return [1, 1, 1];
          if (x[1] == 1) return [1, 0, 1];
          if (x[2] == 1) return [0, 1, 1];
          if (x[3] == 1) return [0, 0, 1];
          return [0, 0, 0];
      }
      return [0];
    }

    // ---------- Next state (sequential). Returns -1 if invalid ----------
    function nextState(name, x, q) {
      switch (name) {
        case "SR Latch":
          if (x[0] == 1 && x[1] == 1) return -1;
          if (x[0] == 1) return 1;
          if (x[1] == 1) return 0;
          return q;

        case "D Flip-Flop":
          return x[0];

        case "JK Flip-Flop":
          if (x[0] == 1 && x[1] == 1) return 1 - q;
          if (x[0] == 1) return 1;
          if (x[1] == 1) return 0;
          return q;

        case "T Flip-Flop":
          if (x[0] == 1) return 1 - q;
          return q;
      }
      return q;
    }

    // ---------- Description and formula ----------
    function getInfo(name) {
      switch (name) {
        case "AND":  return ["Output is 1 only if both A and B are 1.", "Y = A · B"];
        case "OR":   return ["Output is 1 if at least one input is 1.", "Y = A + B"];
        case "NOT":  return ["Output is the opposite of A.", "Y = A'"];
        case "NAND": return ["Output is the opposite of AND.", "Y = (A · B)'"];
        case "NOR":  return ["Output is 1 only if both inputs are 0.", "Y = (A + B)'"];
        case "XOR":  return ["Output is 1 when A and B differ.", "Y = A ⊕ B"];
        case "XNOR": return ["Output is 1 when A and B are the same.", "Y = (A ⊕ B)'"];

        case "Half Adder":
          return ["XOR + AND gates. Adds two bits.", "SUM = A ⊕ B , CARRY = A · B"];
        case "Full Adder":
          return ["Adds three bits: A, B and Carry In.", "SUM = A ⊕ B ⊕ Cin , CARRY = AB + Cin(A ⊕ B)"];
        case "Half Subtractor":
          return ["Computes A − B for two bits.", "DIFF = A ⊕ B , BORROW = A' · B"];
        case "Full Subtractor":
          return ["Computes A − B − Borrow In.", "DIFF = A ⊕ B ⊕ Bin , BORROW = A'B + (A ⊕ B)'·Bin"];

        case "2:1 MUX":
          return ["Selects D0 or D1 depending on select line S.", "Y = S'·D0 + S·D1"];
        case "4:1 MUX":
          return ["Selects one of four data inputs using S1 S0.", "Y = S1'S0'D0 + S1'S0D1 + S1S0'D2 + S1S0D3"];
        case "1:2 DEMUX":
          return ["Routes D to Y0 or Y1 based on S.", "Y0 = S'·D , Y1 = S·D"];
        case "1:4 DEMUX":
          return ["Routes D to one of four outputs using S1 S0.", "Yk = D · (S1 S0 = k)"];
        case "2:4 Decoder":
          return ["Activates exactly one output line for the 2-bit input.", "Y0 = A1'A0' , Y1 = A1'A0 , Y2 = A1A0' , Y3 = A1A0"];
        case "4:2 Encoder":
          return ["Priority encoder: outputs the binary index of the highest active input. V = valid.",
                  "A1 = D3 + D2 , A0 = D3 + D2'·D1 , V = D3+D2+D1+D0"];

        case "SR Latch":
          return ["Level-sensitive memory. S sets Q=1, R resets Q=0. S=R=1 is invalid. Updates immediately when inputs change.",
                  "Q⁺ = S + R'·Q  (S·R = 0)"];
        case "D Flip-Flop":
          return ["On each clock edge, Q takes the value of D.", "Q⁺ = D"];
        case "JK Flip-Flop":
          return ["J=K=0 hold, J=1 set, K=1 reset, J=K=1 toggle (on clock edge).", "Q⁺ = J·Q' + K'·Q"];
        case "T Flip-Flop":
          return ["T=1 toggles Q on each clock edge, T=0 holds.", "Q⁺ = T ⊕ Q"];
      }
      return ["", ""];
    }

    // ---------- Button actions ----------
    function pick(name) {
      current = name;
      var names = getInputNames(name);
      x = [];
      for (var i = 0; i < names.length; i++) {
        x[i] = 0;
      }
      Q = 0;
      clockHistory = [];
      render();
    }

    function toggle(i) {
      x[i] = 1 - x[i];
      if (current == "SR Latch") {          // latch updates immediately
        var r = nextState(current, x, Q);
        if (r != -1) Q = r;
      }
      render();
    }

    function clock() {
      var r = nextState(current, x, Q);
      if (r != -1) Q = r;
      clockHistory.push(Q);
      if (clockHistory.length > 16) clockHistory.shift();
      render();
    }

    // ---------- Show everything on the page ----------
    function render() {
      var names = getInputNames(current);
      var seq = isSequential(current);
      var info = getInfo(current);

      document.getElementById("sel").value = current;
      document.getElementById("desc").textContent = info[0];
      document.getElementById("formula").textContent = info[1];

      // badge
      var badge = document.getElementById("badge");
      if (seq) {
        badge.className = "badge seq";
        badge.textContent = "Sequential circuit";
      } else if (isGate(current)) {
        badge.className = "badge gate";
        badge.textContent = "Logic gate";
      } else {
        badge.className = "badge comb";
        badge.textContent = "Combinational circuit";
      }

      // input boxes
      var html = "";
      for (var i = 0; i < names.length; i++) {
        html += '<div class="ib">' +
                '<h3>' + names[i] + '</h3>' +
                '<div class="val">' + x[i] + '</div>' +
                '<button onclick="toggle(' + i + ')">Change ' + names[i] + '</button>' +
                '</div>';
      }
      if (hasClock(current)) {
        html += '<div class="ib">' +
                '<h3>CLOCK</h3>' +
                '<div class="val">↑</div>' +
                '<button class="clk" onclick="clock()">Clock ↑</button>' +
                '</div>';
      }
      document.getElementById("inputs").innerHTML = html;

      // outputs
      var outNames, outVals;
      if (seq) {
        outNames = ["Q", "Q'"];
        outVals = [Q, 1 - Q];
      } else {
        outNames = getOutputNames(current);
        outVals = calculate(current, x);
      }

      var out = '<b style="font-size:20px">Output:</b>';
      for (var j = 0; j < outNames.length; j++) {
        var cls = "pill";
        if (outVals[j] == 0) cls += " zero";
        out += '<div class="' + cls + '">' + outNames[j] + ': ' + outVals[j] + '</div>';
      }
      if (seq) {
        out += '<div class="pill state">State Q = ' + Q + '</div>';
      }
      document.getElementById("out").innerHTML = out;

      // warning
      var warn = "";
      if (current == "SR Latch" && x[0] == 1 && x[1] == 1) {
        warn = "⚠ Invalid input combination (S = R = 1): next state undefined.";
      }
      document.getElementById("warn").textContent = warn;

      // clock history
      var h = "";
      if (hasClock(current)) {
        if (clockHistory.length > 0) h = "Q after each clock edge: " + clockHistory.join(" → ");
        else h = "Q after each clock edge: (press Clock)";
      }
      document.getElementById("hist").textContent = h;

      drawCircuit(names, outNames, outVals);
      drawTable(names);
    }

    // ---------- Circuit diagram (SVG) ----------
    function wireColor(value) {
      if (value == 1) return "#20d4ad";
      return "#4a5675";
    }

    function drawCircuit(inNames, outNames, outVals) {
      var count = inNames.length;
      if (hasClock(current)) count = count + 1;          // extra row for CLK
      if (outNames.length > count) count = outNames.length;

      var H = count * 40 + 40;
      var mid = H / 2;
      var boxColor = isSequential(current) ? "#a35cd6" : "#5b8cd6";

      var s = '<svg viewBox="0 0 720 ' + H + '" xmlns="http://www.w3.org/2000/svg" font-family="Arial" font-size="15">';

      // box and name
      s += '<rect x="240" y="14" width="200" height="' + (H - 28) + '" rx="12" fill="#101827" stroke="' + boxColor + '" stroke-width="2"/>';
      s += '<text x="340" y="' + (mid + 5) + '" text-anchor="middle" fill="#fff" font-size="17" font-weight="bold">' + current + '</text>';
      if (isSequential(current)) {
        s += '<text x="340" y="' + (mid + 26) + '" text-anchor="middle" fill="#e0a3ff" font-size="14">Q = ' + Q + '</text>';
      }

      // input wires
      var totalIn = inNames.length;
      if (hasClock(current)) totalIn = totalIn + 1;
      for (var i = 0; i < totalIn; i++) {
        var y = mid + (i - (totalIn - 1) / 2) * 40;
        if (i < inNames.length) {
          s += '<line x1="70" y1="' + y + '" x2="240" y2="' + y + '" stroke="' + wireColor(x[i]) + '" stroke-width="4"/>';
          s += '<text x="60" y="' + (y + 5) + '" text-anchor="end" fill="#a9bee8">' + inNames[i] + ' = ' + x[i] + '</text>';
        } else {
          s += '<line x1="70" y1="' + y + '" x2="240" y2="' + y + '" stroke="#a35cd6" stroke-width="4"/>';
          s += '<text x="60" y="' + (y + 5) + '" text-anchor="end" fill="#a9bee8">CLK</text>';
        }
      }

      // output wires
      for (var k = 0; k < outNames.length; k++) {
        var y2 = mid + (k - (outNames.length - 1) / 2) * 40;
        s += '<line x1="440" y1="' + y2 + '" x2="590" y2="' + y2 + '" stroke="' + wireColor(outVals[k]) + '" stroke-width="4"/>';
        s += '<text x="600" y="' + (y2 + 5) + '" fill="#a9bee8">' + outNames[k] + ' = ' + outVals[k] + '</text>';
      }

      s += '</svg>';
      document.getElementById("svgbox").innerHTML = s;
    }

    // ---------- Truth table / characteristic table ----------
    function drawTable(inNames) {
      var n = inNames.length;
      var seq = isSequential(current);

      // heading
      var head = "<tr>";
      for (var i = 0; i < n; i++) {
        head += "<th>" + inNames[i] + "</th>";
      }
      if (seq) {
        head += "<th>Q</th><th>Q⁺ (next)</th>";
        document.getElementById("ttl").textContent = "Characteristic Table";
      } else {
        var outNames = getOutputNames(current);
        for (var j = 0; j < outNames.length; j++) {
          head += "<th>" + outNames[j] + "</th>";
        }
        document.getElementById("ttl").textContent = "Truth Table";
      }
      head += "</tr>";
      document.getElementById("th").innerHTML = head;

      // rows: 2^n combinations
      var rows = "";
      var total = Math.pow(2, n);

      for (var row = 0; row < total; row++) {
        var t = [];
        var same = true;
        for (var b = 0; b < n; b++) {
          t[b] = (row >> (n - 1 - b)) & 1;
          if (t[b] != x[b]) same = false;
        }

        if (seq) {
          for (var q = 0; q < 2; q++) {
            var next = nextState(current, t, q);
            var cls = (same && q == Q) ? "active" : "";
            rows += '<tr class="' + cls + '">';
            for (var c = 0; c < n; c++) rows += "<td>" + t[c] + "</td>";
            rows += "<td>" + q + "</td>";
            rows += "<td>" + (next == -1 ? "?" : next) + "</td></tr>";
          }
        } else {
          var result = calculate(current, t);
          var cls2 = same ? "active" : "";
          rows += '<tr class="' + cls2 + '">';
          for (var d = 0; d < n; d++) rows += "<td>" + t[d] + "</td>";
          for (var e = 0; e < result.length; e++) rows += "<td>" + result[e] + "</td>";
          rows += "</tr>";
        }
      }
      document.getElementById("tb").innerHTML = rows;
    }

    // ---------- Start ----------
    var sel = document.getElementById("sel");
    for (var g = 0; g < groups.length; g++) {
      var og = document.createElement("optgroup");
      og.label = groups[g][0];
      for (var m = 0; m < groups[g][1].length; m++) {
        var op = document.createElement("option");
        op.textContent = groups[g][1][m];
        og.appendChild(op);
      }
      sel.appendChild(og);
    }
    sel.onchange = function () { pick(sel.value); };

    pick("AND");
  </script>
</body>
</html>
